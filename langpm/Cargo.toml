[package]
name = "langpm"
description = "Lang.P package manager — manifest, lock file, dependency resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
semver = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "langpm"
path = "src/lib.rs"
