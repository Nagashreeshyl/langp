name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build lang, langc, and lang-lsp (release-fast)
        run: |
          cargo build --profile release-fast -p lang -p langc -p langp-lsp --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            for bin in lang langc lang-lsp; do
              cp "target/${{ matrix.target }}/release-fast/${bin}.exe" "dist/${bin}-${{ matrix.suffix }}"
            done
          else
            for bin in lang langc lang-lsp; do
              cp "target/${{ matrix.target }}/release-fast/${bin}" "dist/${bin}-${{ matrix.suffix }}"
            done
            chmod +x dist/*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/*

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build VS Code extension
        run: |
          cd editors/vscode-langp
          npm ci
          npm run compile
          npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: editors/vscode-langp/*.vsix

  release:
    needs: [build, extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
