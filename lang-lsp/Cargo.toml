[package]
name = "langp-lsp"
description = "Language Server Protocol implementation for Lang.P"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "lang-lsp"
path = "src/main.rs"

[dependencies]
langp-lexer = { workspace = true }
langp-ast = { workspace = true }
langp-parser = { workspace = true }
langp-semantic = { workspace = true }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
